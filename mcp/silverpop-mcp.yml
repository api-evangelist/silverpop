note: >-
  Nobody ships an MCP server for this API — not the provider, not the community. mode is
  `none` and endpoint/install are deliberately empty; no URL was guessed. The tools below
  are a CANDIDATE surface derived from operations the provider documents by name in its
  own reference, so the names are real even though no server exposes them.

  Two things would make a server here awkward and are worth recording before anyone builds
  one. First, there is no base URL — the host embeds a per-tenant region and pod
  (api-campaign-{region}-{pod}.goacoustic.com), so the server's endpoint is configuration,
  not a constant. Second, there is no scope model: a refresh token inherits the full
  Campaign permissions of the human it is bound to, so an agent handed one can do anything
  that user can do in the UI, including PurgeData and RemoveRecipient. Any real server
  should gate the destructive tools explicitly — see agentic-access/silverpop-agentic-access.yml.
