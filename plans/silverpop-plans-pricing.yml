ownership_note: >-
  Pricing is read from acoustic.com because silverpop.com and www.silverpop.com both 301
  to https://www.acoustic.com — Acoustic owns and sells the platform Silverpop Engage
  became, and there is no separately-priced Silverpop product left to quote.
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented a "Free" freemium tier with a monthly API
  request quota and an overage rate. The provider publishes no free tier, no request
  quota and no price of any kind. The scaffold has been replaced with what is actually on
  the pricing page.
description: >-
  Three named packages — Professional, Premium and Ultimate — differentiated by
  capability, not by API call volume. Not one of them carries a number: every tier's call
  to action is "Get a demo", there is no self-serve checkout, no list price, no currency,
  no billing period and no published quota or overage. The page's own pitch is that
  packaging is based on "your messaging volume, your data depth, and your personalization
  ambition" rather than audience size, but none of those dimensions is quantified
  publicly. API access is not itemized as a priced line item on any tier — it comes with
  the platform contract, which is also why the API developer's guide states that use of
  the XML API is "strictly prohibited unless you have a valid, unexpired Agreement in
  place."
