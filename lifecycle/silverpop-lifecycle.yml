changelog:
  published: false
  note: >-
    The Acoustic Campaign ReadMe project has its changelog module disabled (the project
    metadata served with every page carries "changelog": false), so there is no dated
    release feed for this API. The reference pages carry per-page updatedAt timestamps —
    most recently 2026-04-08, with the Postman collection page updated 2026-06-12 — which
    is the only public change signal available. No changelog/ artifact was written rather
    than assert a feed that does not exist.
brand_lineage:
- year: 1999
  event: Silverpop founded; Engage is the email marketing platform and the API takes its shape.
- year: 2014
  event: IBM acquires Silverpop. The product becomes IBM Watson Campaign Automation; the npm SDK is published as watson-campaign-automation-api.
- year: 2019
  event: >-
    IBM's marketing platforms are carved out as Acoustic. The GitHub organization stays at
    github.com/Silverpop to this day.
- year: 2020
  month: 4
  event: >-
    Domain migration announced on the developer portal overview — "Beginning in April 2020,
    Acoustic will transfer URLs for all Acoustic products to Acoustic-branded domains",
    off customer-engagement.ibm.com and ibmmarketingcloud.com and onto goacoustic.com.
    This is the migration that produced the api-campaign-<region>-<pod>.goacoustic.com
    hosts in use today.
  evidence: https://developer.goacoustic.com/acoustic-campaign/reference/overview
- year: 2026
  event: >-
    silverpop.com and www.silverpop.com 301 to https://www.acoustic.com (verified
    2026-08-13). The Silverpop brand no longer resolves to a product page; the live API is
    Acoustic Campaign, advertised as one of six anchors in the RFC 9727 api-catalog at
    developer.goacoustic.com.
regional_topology:
  note: >-
    Not versioning, but the closest thing this API has to an addressing contract: every
    organization is pinned to a numbered pod in a named region, and the pod is part of the
    hostname — api-campaign-us-1, api-campaign-us-5, api-campaign-eu-1 and so on. The
    provider's Postman instructions say it plainly: "Remember to use your specific pod
    number and data center before submitting a request." A caller that hardcodes us-1 will
    silently address the wrong tenant estate.
  evidence: https://developer.goacoustic.com/acoustic-campaign/reference/postman-collection
