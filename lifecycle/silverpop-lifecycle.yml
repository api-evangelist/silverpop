description: >-
  The Silverpop Engage API is one of the longest-lived commercial marketing APIs still in
  production, and its lifecycle story is a brand story. The product has changed owner and
  name three times without changing its wire contract: Silverpop Engage, then IBM Watson
  Campaign Automation, now Acoustic Campaign. The XML API operation names an integrator
  calls today — AddRecipient, ScheduleMailing, RawRecipientDataExport — are the original
  Silverpop names. What moved was the hostname.
versioning:
  scheme: none
  in_url: false
  in_header: false
  current_version: null
  note: >-
    Neither surface is versioned. The REST base path is /rest with no version segment;
    the XML API posts to /XMLAPI. There is no Accept-header version negotiation and no
    published version identifier for the API itself. The only version-shaped thing on the
    developer portal is ReadMe's own docs version ("1.0"), which describes the
    documentation, not the contract.
  evidence: https://developer.goacoustic.com/acoustic-campaign/reference/rest-api-overview
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    There is no written deprecation policy, no advance-notice window, and no RFC 8594
    Sunset/Deprecation header. There IS one concrete, in-force deprecation, documented in
    prose: JSESSIONID session authentication. The provider files it under "Legacy
    authentication method", caps it at 20 active sessions per organization, warns that
    abandoned sessions block new ones, and states that "all users of the Acoustic Campaign
    XML API are strongly encouraged to use OAuth 2.0 authentication." That is a
    deprecation with a named successor and a migration path — but no retirement date, so
    an integrator cannot plan against it.
  deprecated:
  - id: jsessionid-session-auth
    what: Legacy JSESSIONID user-session authentication for the XML API
    status: discouraged
    successor: OAuth 2.0 refresh_token grant
    announced: null
    sunset: null
    evidence: https://developer.goacoustic.com/acoustic-campaign/reference/legacy-authentication-method-jsessionid-user-sessions
    migration: https://developer.goacoustic.com/acoustic-campaign/reference/getting-started-with-oauth
