format: legacy-xml-fault
rfc9457: false
note: >-
  This API predates problem+json by more than a decade and it shows. There are two
  entirely separate error surfaces and they do not share a shape.

  (1) The XML API returns a SOAP-ish fault envelope. The provider publishes 116 numbered
  error codes; the human-readable detail arrives in the `Fault String` element, and the
  number in `errorid`. The numbering is not a namespace — it is three eras stacked on top
  of each other: 1-6 are the forward-to-friend (FTF_*) symbolic constants, 50-52 are
  request-level transport failures, 100-1018 are the operational catalogue, and several
  numbers are documented with a bare symbolic constant (ERR_INVALID_ALLOW_HTML) rather
  than a sentence.

  (2) The REST API returns ordinary HTTP status codes with a general-errors /
  field-errors split: 400 for a malformed request, 404 for an unknown database or
  contact, 422 for per-column validation failures, 500 for internal faults — including,
  notably, a 500 when an email address is on the system blocked list, which is a business
  outcome surfaced as a server error.

  Neither surface emits application/problem+json, neither carries a stable machine-
  readable `type` URI, and there is no 429. Codes below are transcribed verbatim from the
  provider's published tables — descriptions are the provider's own wording, including
  where that wording is only a constant name.
envelope:
  xml_api:
    error_id_field: errorid
    message_field: Fault String
    success_field: SUCCESS
  rest_api:
    style: http-status
    levels:
    - general errors
    - field errors
    note: >-
      Field errors are returned per column in the form "{columnName}: {message}" and can
      be raised for ANY column on the record, not only the columns named in the request.
counts:
  xml_error_codes: 116
  rest_status_codes_documented: 5
rest_status_codes:
- status: 200
  meaning: Success.
- status: 400
  level: general errors
  meaning: Bad request — malformed or missing required input (for example a lookup key not supplied, or a value that is not a valid email).
- status: 404
  level: general errors
  meaning: Database not found, or no contact found, for an invalid {databaseId} or {contactId}.
- status: 422
  level: general errors + field errors
  meaning: >-
    Unprocessable entity. The general-errors form covers column not found, lookup key not
    found and channel not found; the field-errors form covers per-column type validation
    — boolean must be Yes or No, date must be yyyy-MM-dd, time must be HH:mm:ss or HH:mm,
    timestamp must be yyyy-MM-ddTHH:mm:ss.SSSZ, text must be under 4000 characters, STO
    must be an integer 0-168, and multi-select values must be semicolon delimited.
- status: 500
  level: general errors
  meaning: >-
    Internal server error. Also returned when a database ID is not accessible to the
    calling user, and when the submitted email is on the system blocked list — a policy
    decision returned as a 5xx.
rate_limit_errors:
  documented: false
  note: >-
    No 429 and no Retry-After appear anywhere in the response-code reference. Concurrency
    rejection above 10 in-flight requests per organization is described in prose without a
    status code. See rate-limits/silverpop-rate-limits.yml.
