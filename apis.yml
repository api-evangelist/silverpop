name: Silverpop
description: >-
  Silverpop Engage is the email marketing, marketing automation and transactional
  messaging API now sold as Acoustic Campaign, and one of the longest-lived commercial
  marketing APIs still in production. The operation names an integrator calls today —
  AddRecipient, ScheduleMailing, RawRecipientDataExport — are the original Silverpop
  names, unchanged through acquisition by IBM in 2014 (as Watson Campaign Automation) and
  the carve-out to Acoustic in 2019; silverpop.com now 301s to acoustic.com and the
  developer portal lives at developer.goacoustic.com. Two surfaces sit behind one
  per-tenant host: a single-endpoint XML API at /XMLAPI carrying roughly sixty operations
  across contact databases, contact lists, relational tables, scoring models, templates
  and mailings, dynamic content and reporting, and a narrower JSON REST API at /rest with
  eleven resources including gdpr_jobs. Authentication is OAuth 2.0 with the
  refresh_token grant only and no scope model; the binding runtime limit is a cap of ten
  concurrent requests per organization rather than a request rate.
x-successor:
  brand: Acoustic
  profile: all/acoustic
  note: >-
    Silverpop is the legacy brand of the platform Acoustic sells today. This profile
    covers the Silverpop-branded surface — the github.com/Silverpop SDK organization and
    the Engage/Campaign API contract that carries the Silverpop operation names. The
    live Acoustic Campaign Swagger 1.1 service descriptions are held once, in the
    Acoustic profile, and are deliberately not duplicated here.
