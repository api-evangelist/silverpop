  - https://developer.goacoustic.com/acoustic-campaign/reference/api-developers-guide-and-legal-information
  generated: '2026-08-13'
  method: searched
  note: >-
    Corrects a 2026-07-22 derivation that read "freemium / self-serve" off a scaffolded
    plans file. The provider publishes three packages (Professional, Premium, Ultimate),
    no prices, no free tier and no self-serve signup — every tier's call to action is "Get
    a demo" — and the API developer's guide states that use of the XML API is "strictly
    prohibited unless you have a valid, unexpired Agreement in place." Documentation is
    fully public and requires no login.
