source: >-
  https://github.com/Silverpop (the first-party GitHub organization already wired
  into apis.yml) reconciled against registry.npmjs.org, trunk.cocoapods.org and
  search.maven.org
ownership_note: >-
  Silverpop is the legacy brand of the platform now sold as Acoustic. silverpop.com
  and www.silverpop.com both 301 to https://www.acoustic.com, the developer portal
  moved to developer.goacoustic.com, and the npm package published from the
  Silverpop GitHub organization is maintained by an npm account named
  "eric.hutson-acoustic" — so packages served from acoustic.com / acoustic.co
  identities are this provider's own, not a third party's.
note: >-
  Every first-party client library for this API is a source-of-record artifact of the
  Silverpop / IBM Watson Campaign Automation era, and the currency signal is split.
  The Node library that wraps the Campaign XML API — published to npm under the name
  watson-campaign-automation-api, not "silverpop" or "node-engage" — last shipped
  0.1.9 on 2019-11-19, before the brand had even finished migrating to the
  goacoustic.com domains in April 2020. The Java client (com.silverpop:spapi-client
  1.2.6) was never published to Maven Central at all and its last commit is
  2021-07-14. The only library still moving is the mobile SDK, which was rebuilt
  under the Acoustic name: AcousticMobilePush 3.10.6 shipped to CocoaPods on
  2026-02-17. So an integrator wiring up the Campaign REST/XML API in 2026 is being
  handed an SDK that has not been released in nearly seven years, while the API it
  wraps is still live and its reference pages were republished 2026-04-08.
