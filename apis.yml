x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 9
  pass: local-v1
  note: >-
    Contract discovery ran to the end of STEP 0b and the honest answer is that this
    provider publishes no OpenAPI. developer.goacoustic.com is a ReadMe SuperHub whose
    catch-all answers HTTP 200 with the same 740,863-byte HTML shell for /openapi.json,
    /swagger.json, /api-docs, /redoc and every /.well-known/* path — the classic soft-200.
    Its server-rendered state does list four uploaded API definitions (events-2, events-5,
    events-6, events-7.json) but exposes no public download route, and api.readme.com/v2
    401s without a key. Exactly one real document is served from a well-known path: an
    RFC 9727 api-catalog (application/linkset+json) with six anchors, saved verbatim. The
    only machine-readable service description that exists is Swagger 1.1, served live off
    the API host itself at /restdoc/<resource> — verified 200 at
    api-campaign-us-1.goacoustic.com/restdoc/messages. Those Swagger documents were
    harvested into the sibling Acoustic profile on the same day and are NOT duplicated
    here.

    Two corrections were more valuable than the additions. The plans and rate-limits files
    were 2026-05-04 bulk-sweep scaffolds asserting a free tier with a monthly request
    quota and a full X-RateLimit-* header set; the provider publishes none of that. Real
    pricing is three unpriced sales-gated packages, and the real limit is a concurrency
    cap of 10 in-flight requests per organization with no rate-limit headers anywhere on
    the API. The accessModel block, which had been derived from that scaffold as
    "freemium / self-serve", was corrected to paid / sales.

    Package currency is the sharpest signal in this profile: the first-party Node client
    on npm (watson-campaign-automation-api, named for the IBM era) last shipped 0.1.9 on
    2019-11-19, the Java client was never published to Maven Central at all, and only the
    mobile SDK still moves — AcousticMobilePush 3.10.6 on CocoaPods, 2026-02-17.

    Not written, deliberately: no a2a/ (the agent-card 200s are the SPA shell), no
    changelog/ (the docs project has its changelog module disabled), no scopes/ (the OAuth
    model has none — a refresh token inherits the bound user's full permissions), no
    skills/ and no overlays/ (the six files in openapi/ are pipeline scaffolds, not
    provider-published, and their operationIds are invented — grounding skills in them
    would teach an agent to call paths like /rest/mailings that the live Swagger shows as
    /rest/messages).
